# Your season. Edit this, then run `uv run trailplan plan` to rebuild the plan.

[athlete]
# Leave weekly_hours / long_run_min commented out to auto-detect them from your
# last 4-6 weeks of Garmin activities when you run `trailplan plan`.
# weekly_hours = 5.0     # typical running hours per week right now
# long_run_min = 120     # longest run in the last month, in minutes
days_per_week = 4        # 3-6 running days
long_run_day = "sun"     # back-to-back runs (ultra builds) go the day after
strength = true          # adds a trail strength session (1-2x/week)
hr_targets = true        # false = no heart-rate zone alerts on the watch
fuel_every_min = 30      # long runs beep "FUEL: gel + drink" this often (0 = off)
easy_pace = "6:30"       # easy pace on flat ground (min/km) - used to estimate race durations
carbs_per_hour = 75      # race-day fuelling target (g carbs/hr)
fluid_ml_per_hour = 600  # race-day fluid target (ml/hr)

# priority: "A" = goal race (full taper), "B" = training race inside a bigger build (short taper)
# goal_time (optional) overrides the estimated race duration, e.g. goal_time = "8:30"

[[race]]
name = "UTA 50"
date = 2027-05-15
distance_km = 51.4
elevation_m = 2429
priority = "B"
start = "06:30"          # ESTIMATE - start groups (05:05-08:00) are published 12 Mar 2027
# Course and cut-offs as published for 2026 on uta.utmb.world (shown for 2027).
# Overall limit is also 14h30 from your start.
[[race.checkpoint]]
name = "CP1 Fairmont Resort"
km = 18.4
gain_m = 900
aid = "full"
cutoff = "13:00"
